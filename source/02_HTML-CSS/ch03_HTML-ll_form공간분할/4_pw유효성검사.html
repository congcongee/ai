<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <title></title>
  <script>
    function chk() {
      if (frm.id.value.trim().length < 4) {
        alert('아이디는 4글자 이상 필수입력입니다');
        frm.id.focus();
        return false;
      } else if (frm.pw.value.length < 4) {
        alert('비밀번호는 4자리 이상 필수입력입니다');
        frm.pw.focus();
          return false;
      } else if (frm.pw.value != frm.pwChk.value) {
        alert('비밀번호를 확인하세요');
        frm.pw.value = '';
        frm.pwChk.value = '';
        frm.pw.focus();
        return false; // submit 제한
      }
      return true;
    }
  </script>
</head>
<body>
  <form name="frm" onsubmit="return chk()">
    <table>
      <tr>
        <td><label for="id">아이디</label></td>
        <td>
          <input type="text" name="id" id="id" placeholder="4글자이상"/>
        </td>
      </tr>
      <tr>
        <td><label for="pw">비밀번호</label></td>
        <td><input type="password" name="pw" id="pw" placeholder="4자리이상"/></td>
      </tr>
      <tr>
        <td><label for="pwChk">비밀번호</label></td>
        <td><input type="password" name="pwChk" id="pwChk" placeholder="확인용 비번" /></td>
      </tr>
      <tr>
        <th colspan="2"><input type="submit" value="가입"/></th>
      </tr>
    </table>
  </form>
</body>
</html>
