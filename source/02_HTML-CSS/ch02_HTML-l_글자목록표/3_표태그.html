<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <title></title>
  <style>
      table{
        background-color:#000000; /*검정*/
        margin: 10px 20px; /* 밖여백 : 위여백, 오른쪽여백, 이래여백, 왼쪽여백*/      
      }
      tr{background-color:#FFFFFF; /*흰색
      td{
        padding:5px 10px; /* 안여백 : 위, 오른쪽, 아래, 왼쪽*/
        text-align:center; /* 글씨 가운데 정렬 */      
      }
  </style>
</head>
<body>
    <table>
        <caption>기본테이블(병합x)</caption>
        <tr>
        <td>1행1열</td><td>1행2열</td><td>1행3열</td><td>1행4열</td>
        </tr>
        <tr>
        <td>2행1열</td><td>2행2열</td><td>2행3열</td><td>2행4열</td>
        </tr>
        <tr>
        <td>3행1열</td><td>3행2열</td><td>3행3열</td><td>3행4열</td>
        </tr>
    </table>
    <table>
        <caption>기본테이블(열병합, 행병합)</caption>
        <tr>
        <th>1행1열</th><td colspan="3">1행2,3,4열</td>
        </tr>
        <tr>
        <td>2행1열</td><td>2행2열</td><td rowspan="2">2,3행3열</td><td>2행4열</td>
        </tr>
        <tr>
        <td>3행1열</td><td>3행2열</td><td>3행4열</td>
        </tr>
    </table>
</body>
</html>
