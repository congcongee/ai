<head>

  <title></title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap');
    @font-face {
      font-family: 'NanumHimNae';
      src: url('ch05/NanumHimNaeRaNeunMarBoDan.ttf');
    }

    p.localfont {
      font-family: 'NanumHimNae','Times New Roman', Times, serif; /* 로컬폰트, 시스템 폰트 */

      text-decoration: underline;
      line-height: 40px; /* 행 간격 늘리기 */

      font-family: "Gamja Flower", sans-serif;

    }

<body>
  <p class="localfont">
    내프로젝트폴더에 ttf파일 로컬 존재
    신봉선처럼 하루에 2만 보 이상 걷는 것은 상당히 많은 활동량에 해당하며, 체중 감량 및 유지 모두에 도움이 될 수 있다. 걷기는 관절 부담이 적은 편에 속하는 유산소 운동으로 지방을 에너지원으로 사용하는 데 효과적이다.
  </p>

  </p>
