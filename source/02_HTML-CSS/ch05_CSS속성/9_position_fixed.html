<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        *{margin:0; padding:0;}
        div{width:200px; height:200px; opacity:0.7; border:1px solid red;}
        #div1{
            position:absolute; /* 절대좌표 기본 position값:static */
            top:0; left:0;
            background-color:red;
        }
        #div2{
            position:fixed;
            top:100px; left:100px;
            background-color:blue;
            z-index:100; /* z-index가 큰 태그가 위로*/
        }
        #div3{
            position:absolute;
            top:350px; left:350px;
            width:300px; height:300px; background-color:red; opacity:1;
            z-index:50;
        }
        #div4{
            position:absolute;
            top:50px; left:50px;
            background-color:yellow;
        }
    </style>
</head>
<body>
    <div id="div1">div1</div>
    <div id="div2">div2</div>
    <div id="div3">
     div3
    <div id="div4">div4</div>
    </div>
</body>
</html>
