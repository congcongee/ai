{% extends "base.html" %}
{% block title %}회원가입{% endblock %}
{% block content %}
<section class="page">
  <div class="wrap">
    <!-- 02_HTML-CSS ch02 pw유효성검사·정규표현식 + 03_javaScript ch12 fetch(keyup) 아이디 중복확인 -->
    <form name="frm" action="{{ url_for('join') }}" method="post" class="form-box narrow" onsubmit="return chk()">
      <div class="page-title">
        <span class="eyebrow">JOIN</span>
        <h2 class="display">회원가입</h2>
      </div>
      {% if msg %}<p class="msg">{{ msg }}</p>{% endif %}
      <div class="field">
        <label for="id">아이디</label>
        <input type="text" name="id" id="id" placeholder="영문 소문자·숫자 4~12자" autocomplete="off" autofocus>
        <span class="hint" id="idConfirmResult">영문 소문자로 시작, 4~12자</span>
      </div>
      <div class="field">
        <label for="name">이름</label>
        <input type="text" name="name" id="name">
      </div>
      <div class="field">
        <label for="pw">비밀번호</label>
        <input type="password" name="pw" id="pw" placeholder="영문+숫자 8자 이상">
      </div>
      <div class="field">
        <label for="pwChk">비밀번호 확인</label>
        <input type="password" name="pwChk" id="pwChk">
      </div>
      <p><input type="submit" value="가입" class="btn primary" style="width:100%"></p>
    </form>
  </div>
</section>
<script>
  const idPattern = /^[a-z][a-z0-9]{3,11}$/;           // 영문 소문자로 시작 4~12자
  const pwPattern = /^(?=.*[A-Za-z])(?=.*\d).{8,}$/;   // 영문+숫자 포함 8자 이상
  let idOk = false;

  document.querySelector('input[name=id]').addEventListener('keyup', function(){
    const result = document.getElementById('idConfirmResult');
    idOk = false;
    if(!idPattern.test(this.value)){
      result.className = 'hint err';
      result.textContent = '영문 소문자로 시작, 4~12자';
      return;
    }
    let params = new URLSearchParams({id:this.value});
    fetch(`/idConfirm?${params}`)
      .then(response => {
        if(!response.ok) throw new Error('서버 응답 오류 : ' + response.status);
        return response.text();
      })
      .then(data => {
        idOk = data.includes('사용 가능');
        result.className = idOk ? 'hint ok' : 'hint err';
        result.textContent = data;
      })
      .catch(error => alert(error.message));
  });

  function chk(){
    if(!idOk){
      alert('아이디를 확인하세요');
      frm.id.focus();
      return false;
    }else if(!frm.name.value.trim()){
      alert('이름은 필수입력입니다');
      frm.name.focus();
      return false;
    }else if(!pwPattern.test(frm.pw.value)){
      alert('비밀번호는 영문+숫자 포함 8자 이상입니다');
      frm.pw.focus();
      return false;
    }else if(frm.pw.value != frm.pwChk.value){
      alert('비밀번호를 확인하세요');
      frm.pw.value = '';
      frm.pwChk.value = '';
      frm.pw.focus();
      return false; // submit 제한
    }
    return true;
  }
</script>
{% endblock %}
