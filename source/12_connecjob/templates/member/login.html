{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<section class="page">
  <div class="wrap">
    <form action="{{ url_for('login') }}" method="post" class="form-box narrow">
      <div class="page-title">
        <span class="eyebrow">LOGIN</span>
        <h2 class="display">로그인</h2>
        <p class="muted" style="font-weight:400">테스트 계정 : hong / 1234</p>
      </div>
      {% if msg %}<p class="msg">{{ msg }}</p>{% endif %}
      <input type="hidden" name="next" value="{{ next | default('') }}">
      <div class="field">
        <label for="id">아이디</label>
        <input type="text" name="id" id="id" required autofocus autocomplete="off">
      </div>
      <div class="field">
        <label for="pw">비밀번호</label>
        <input type="password" name="pw" id="pw" required>
      </div>
      <p><input type="submit" value="로그인" class="btn primary" style="width:100%"></p>
      <p style="margin-top:12px;text-align:center" class="muted">계정이 없나요? <a href="{{ url_for('join') }}"><b>회원가입</b></a></p>
    </form>
  </div>
</section>
{% endblock %}
