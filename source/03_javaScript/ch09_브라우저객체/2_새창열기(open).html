<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <script>
    var child = open('', '', 'width=450, height=500');
    /* open(속성1, 속성2, 속성3);
     * 속성1 : 열린 새창(child창)의 url
     * 속성2 : 열린 새윈도우 이름
     * 속성3 : width, height, left, top,.. */
    if(child){
      child.document.write('<h1>새창</h1>');
    }else{
      alert('팝업 차단 해제하셔야 새창이 열립니다');
    }
  </script>
</head>

</body>
</html>
