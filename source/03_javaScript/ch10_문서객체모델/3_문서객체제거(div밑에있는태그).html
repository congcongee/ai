<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <script>
    var wrap;
    window.onload = ()=>{
      //wrap = document.getElementById('wrap'); // 1방법
      //wrap = document.getElementsByTagName('div')[0]; // 4방법
      wrap = document.querySelector('div#wrap'); // 5방법
      //wrap = document.querySelectorAll('div#wrap')[0]; // 6방법
    };
    const append = ()=>{
      // h1태그를 body에 추가
      var h1 = document.createElement('h1');
      var textNode = document.createTextNode('추가한 HEADER');
      h1.appendChild(textNode);
      wrap.appendChild(h1);
    };
    const remove = ()=>{
      // h1태그 하나 제거
      //var h1 = document.getElementsByTagName('h1'); // 배열(없으면 빈배열)
      //var h1 = document.querySelector('h1'); // 엘리먼트 하나(없으면 null)
      var h1 = document.querySelectorAll('h1'); // 배열(없으면 null)
      if(h1.length>0){
        wrap.removeChild(h1[0]);
      }else{
        alert('지울 h1태그가 없습니다');
      }
    };
  </script>
</head>
<body>
  <div id="wrap">
    <input type="button" value="태그 추가하기" onclick="append()">
    <button onclick="remove()">태그 제거하기</button>
    <h1>HEADER</h1>
    <h1>HEADER</h1>
  </div>
</body>
</html>
