<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
  <title></title>
  <style>
    h1{cursor: pointer;}
  </style>
  <script>
    window.onload = ()=>{
      var header = document.querySelector('h1');
      // var cnt = 0; // 객세의 속성 갯수
      // for(var key in header){
      //   if(key == 'onclick'){
      //     document.body.innerHTML += `${++cnt}.${key} : ${header[key]} <br>`;
      //   }//if
      // }//for
      // 기본 이벤트 모델 : 이벤트 속성에 function을 할당
        // on으로 시작하는 속성 : 이벤트 속성 ex. onclick
        // 이벤트 이름 : click
        // 이벤트 리스너 함수 : 이벤트 속성에 할당된 함수
      header.onclick = function(){
        // this : 클릭이벤트가 밸생된 엘리먼트 객체. this사용시 화살표함수 불가
        this.innerHTML = 'click 했네';
        this.style.color = 'red';
      };
    };//onload
  </script>
</head>
<body>
  <h1>click 해봐</h1>
</body>
</html>
