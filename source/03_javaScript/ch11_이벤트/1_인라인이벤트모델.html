<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
  <title></title>
  <style>
    h1{cursor: pointer;}
  </style>
  <script>
    // 이벤트 이름 : click
    // 이벤트 속성 변수 : onclick
    // 이벤트 리스너 함수 : whenClick
    const whenClick = ()=>{
      var h1 = document.querySelector('h1'); // 엘리먼트 하나
      h1.innerHTML = 'click 했네';
      h1.style.color = 'red';
    };
  </script>
</head>
<body>
  <h1 onclick="whenClick()">click 해봐</h1>
</body>
</html>
