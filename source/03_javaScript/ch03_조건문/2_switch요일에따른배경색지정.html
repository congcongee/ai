<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
  <title>2_swich요일에따른배경색지정.html</title>
  <script>
    document.write('<h1>요일에 따른 배경색 지정</h1>');
    var week = new Date().getDay(); // 0:일, 1:월, 2:화, 3:수, 4:목, 5:금, 6:토
    switch(week){
      case 0: document.body.style = 'background-color: #FF0000'; break;
      case 1: document.body.style = 'background-color: orange'; break;
      case 2: document.body.style = 'background-color: yellow'; break;
      case 3: document.bgColor = 'green'; break; // rgb(0,0,255)함수는 style에서만 
      case 4: document.body.style = 'background-color: rgb(0,0,255)'; break;
      case 5: document.body.style = 'background-color: navy'; break;
      case 6: document.body.style = 'background-color: violet'; break;
    }
  </script>
</head>

</body>
</html>
