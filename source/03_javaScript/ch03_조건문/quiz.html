<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style>
        p { text-align: center; }
        input[type="number"] {text-align: center; }
    </style>
    <script>
        function chk(){
            // 첫번째 수(frm.su1.value)와 두번째 수를 가져와서 몇번째 수가 얼마 더 큰지 alert
            let num1 = parseInt(document.frm.su1.value);
            let num2 = parseInt(document.frm.su2.value);

            if (isNaN(num1) || isNaN(num2)) {
                alert("두 수를 모두 입력해 주세요.");
                return false;
            }
            let difference = (num1>num2) ? num1-num2 : num2-num1;
            let msg = (num1>num2)? `첫번째 수가 ${difference}만큼 더 크다` :
                      (num2>num1)? `두번째 수가 ${difference}만큼 더 크다` : '두 수는 같다';     
            alert(msg);
            return false;
        }
    </script>
</head>
<body>
    <form name="frm" onsubmit="return chk()">
        <fieldset>
            <p>첫번째수 : <input type="number" name="su1"></p>
            <p>두번째수 : <input type="number" name="su2"></p>
            <p><input type="submit" value="결과"></p>
        </fieldset>
    </form>
</body>
</html>
