	<!-- 'form'의 submit 이벤트에 유효성 검사(#idConfirmResult, #pwChkResult) -->

    document.addEventListener('DOMContentLoaded', ()=>{
			//----------------------------------------------------------------------
			// 1. 아이디 중복 체크(keyup이벤트 + fetch함수) : 2_fetch(keyup).html 참조
			//----------------------------------------------------------------------
			var idInput = document.querySelector('input[name="id"]');
			var idConfirmResult = document.getElementById('idConfirmResult');
			idInput.addEventListener('keyup', function(){ });
			//----------------------------------------------------------------------
			// 2. 두 비밀번호 일치 확인 (keyup이벤트) : 7_이벤트제한(표준이벤트).html 참조
			//----------------------------------------------------------------------
			var pwInput = document.getElementById('pw');
			var pwChkInput = document.getElementById('pwChk');
			var pwChkResult = document.getElementById('pwChkResult');
			function checkPasswordMatch(){

			}
			pwInput.addEventListener('keyup', checkPasswordMatch);
			pwChkResult.addEventListener('keyup', checkPasswordMatch);
			//----------------------------------------------------------------------------
			// 3. 유효성 검사 (form의 submit 이벤트 제한) : 7_이벤트제한(표준이벤트).html 참조
			//   #idConfirmResult('사용 가능한 ID입니다')와 #pwChkResult 내용으로 유효성 검사
			//----------------------------------------------------------------------------
			var joinForm = document.querySelector('form');

  </script>
</head>
<body>
	<div id="joinForm_wrap">
		<form>
			<div id="join_title">회원가입</div>
			<table>
				<tr>
					<th><label for="id">아이디</label></th>
					<td>
						<input type="text" name="id" id="id" class="id" required="required" autocomplete="off">
						<div id="idConfirmResult"> &nbsp; &nbsp; &nbsp; </div>
					</td>
				</tr>
				<tr>
					<th><label for="pw">비밀번호</label></th>
					<td><input type="password" name="pw" id="pw" class="pw"></td>
				</tr>
				<tr>
					<th><label for="pwChk">비밀번호확인</label></th>
					<td>
						<input type="password" name="pwChk" id="pwChk" class="pwChk">
						<div id="pwChkResult"> &nbsp; &nbsp; &nbsp; </div>
					</td>
				</tr>
				<tr>
					<th><label for="name">이름</label></th>
					<td><input type="text" name="name" id="name" class="name" required="required"></td>
				</tr>
				<tr>
					<th>생년월일</th>
					<td><input type="date" name="birth" id="datepicker" class="birth" autocomplete="off" ></td>
				</tr>
				<tr>
					<td colspan="2">
						<input type="submit" value="가입하기" class="joinBtn_style">
						<input type="reset" value="다시하기" class="joinBtn_style">
						<input type="button" value="로그인" class="joinBtn_style">
					</td>
				</tr>
			</table>
		</form>
	</div>
</body>
</html>
