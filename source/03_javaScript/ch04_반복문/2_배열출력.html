<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <script>
      var arr = [273, 32, '홍길동'];// 배열 arr[0], arr[1], arr[2] 
      // 1. 일반 for문(array에서 사용)
      document.write('<h3>1. 일반 for문 이용</h3>');
      for(let idx=0 ; idx<arr.length ; idx++){ // arr.length:배열 방의 갯수
        document.write(idx + '번째 :' + arr[idx] + '<br>');
    }
    // 2. for-in 문(array나 object에서 모두 사용)
    document.write('<h3>1. 일반 for문 이용</h3>');
    for(let idx in arr){
      document.write(`${idx}번째 : ${arr[idx]}<br>`);
    }  
    // 3. for-of 문(array나 object에서 모두 사용) - ECMAScript6 버전에서 추가
    document.write('<h3>3. for-of 문 이용</h3>');
    for(let data of arr){
        document.write(data + '<br>');
    }
    // 4. forEach함수1
    document.write('<h3>4. forEach함수 이용(1)</h3>');
    // 배열명 arr
    // 배열의 데이터를 담을 임시 변수 : data
    // 배열의 index를 담을 임시 변수 : idx
    arr.forEach(function(data, idx){
      document.write(idx + '번째 : ' + data + '<br>');
    });
    // 5. forEach함수2  
    document.write('<h3>5. forEach함수 이용(2)</h3>');
    arr.forEach(function(data){
      document.write(data + '<br>');
    });
    document.write('<h3>6. forEach함수 이용1(화살표함수)</h3>');
    arr.forEach((data, idx) => {
        document.write(idx+'번째'+data+'<br>');
    });
     document.write('<h3>7. forEach함수 이용2(화살표함수)</h3>');
    arr.forEach((data) => {
        document.write(data+'<br>');
    });
    </script>
</head>
<body>
    
</body>
</html>
