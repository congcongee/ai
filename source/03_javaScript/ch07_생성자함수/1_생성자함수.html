<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <script>
    // 생성자 함수
    function Student(name, kor, mat, eng){
      this.name = name;
      this.kor  = kor;
      this.mat  = mat;
      this.eng  = eng;
      this.getSum = function(){
        return this.kor + this.mat + this.eng;
      };
      this.getAvg = function(){
        return Math.round(this.getSum()/3);
      };
      this.toString = function(){
        let output = '';
          for(let key in this){
            if(key!='getSum' && key!='getAvg' && key!='toString'){
              output += key + ':' + this[key] + ' &nbsp; ';
            }else if(key=='getSum' || key=='getAvg'){
              output += key.substring(3).toUpperCase() + ':' + this[key]() + ' &nbsp; ';
            }//if
          }//for
          return output;
      }; // this.toString
    }// 생성자함수
    // s = new Student('홍길동', 90, 90, 80);
    // document.write(s);
    let students = [];
    students.push(new Student('윤하린', 90, 90, 80));
    students.push(new Student('홍길동', 90, 90, 80));
    students.push(new Student('홍길뚱', 90, 90, 80));
    students.push(new Student('홍길똥', 90, 90, 80));
    students.push(new Student('홍길석', 90, 90, 80));
    students.forEach(element => document.write(element + '<br>'));
  </script>
</head>

</body>
</html>
