<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="{{ url_for('static', filename='file.css') }}" 
        rel="stylesheet"
        type="text/css">
  <link href="{{ url_for('static', filename='flask.png') }}"
        rel="icon">
  <title>Document</title>
</head>
<body>
  <!-- HTML 주석 -->
  {# jinja2 템플릿 주석 upper : 기본 필터 / mask_pw:사용자생성필터 #}
  <h2>이름 : {{member.name | upper }}</h2>
  <h2>이이디 : {{member.id | comma }}</h2>
  <h2>비밀번호 : {{member.pw | mask_pw}}</h2>
  <h2>주소 : {{member.addr.title()}}</h2>
</body>
</html>
